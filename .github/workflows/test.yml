name: Tests

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        release: [stable, nightly]
        os: [ubuntu-latest]
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.release }}

      - name: Install jj
        env:
          # jj on crates.io is a stub redirecting to jj-cli; use a released
          # binary directly to avoid a 60s+ cargo build. Pinned + checksummed:
          # jj publishes no checksum file, so the hash was computed from the
          # release artifact when this pin was set. Update both together.
          JJ_VERSION: v0.42.0
          JJ_SHA256: 2d91e81d649e617a81608e7401ad1106029c15ece01ac928c4a351abef42be6a
        run: |
          curl -sSL -o /tmp/jj.tar.gz "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JJ_SHA256}  /tmp/jj.tar.gz" | sha256sum --check
          sudo tar -xz -C /usr/local/bin --strip-components=0 -f /tmp/jj.tar.gz ./jj
          jj --version

      - name: Install Dependencies
        run: |
          git config --global core.compression 0
          git clone https://github.com/nvim-lua/plenary.nvim tmp/plenary
          git clone https://github.com/nvim-telescope/telescope.nvim tmp/telescope
          git clone https://github.com/sindrets/diffview.nvim tmp/diffview
          git clone https://github.com/nvim-telescope/telescope-fzf-native.nvim tmp/telescope-fzf-native
          cd tmp/telescope-fzf-native
          make

      - name: Unit Test
        run: |
          make test
